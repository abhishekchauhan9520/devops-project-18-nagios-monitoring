define host {
  use                     linux-server
  host_name               localhost
  alias                   Localhost
  address                 127.0.0.1
  max_check_attempts      3
  check_period            24x7
  notification_interval   0
  notification_period     24x7
}

define service {
  use                     generic-service
  host_name               localhost
  service_description     HTTP
  check_command           check_http!80
  check_interval          1
  retry_interval          1
  max_check_attempts      3
  notification_interval   0
  notification_period     24x7
}

define service {
  use                     generic-service
  host_name               localhost
  service_description     Host Ping
  check_command           check-host-alive
  check_interval          1
  retry_interval          1
  max_check_attempts      3
}
